# Render "Blueprint" — lets you deploy via New + > Blueprint instead of
# manually filling in the web service form. See DEPLOY.md for the full
# custom-domain / DNS steps this doesn't cover.
services:
  - type: web
    name: video-maker
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
